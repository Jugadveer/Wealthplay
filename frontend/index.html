<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>WealthPlay — practise money before it costs you</title>
    <meta
      name="description"
      content="A five-minute daily set: one puzzle, one market call, one number to estimate, and questions drawn from what you studied. Practise on a virtual portfolio where being wrong costs nothing."
    />
    <meta name="theme-color" content="#fafafb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0c0f" media="(prefers-color-scheme: dark)" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="WealthPlay" />
    <meta
      property="og:description"
      content="Money is a skill. Five minutes a day to practise it, on markets that cost you nothing."
    />

    <!-- A rising line in a graphite tile. Inline, so there is no extra request
         and no missing-favicon gap on first paint. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d0f14'/%3E%3Cpath d='M7 21.5 13 15l4.5 4.5L25 11' fill='none' stroke='%235b8cff' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <script>
      // Set the theme before first paint. Without this the page renders in the
      // wrong palette for a frame and then flips.
      try {
        var stored = localStorage.getItem('wp-theme')
        document.documentElement.dataset.theme =
          stored ||
          (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
      } catch (e) {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
